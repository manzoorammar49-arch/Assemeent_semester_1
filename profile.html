
<head>
     <title>My profile - Homehub</title>

     <link rel="stylesheet" href="style.css">
</head>

<body>

   <!-- Top Navbar -->
    <nav class="navbar navbar-expand-md bg-white shadow-sm">
        <div class="container">

            <!-- Logo and name (click to go Home) -->
            <a class="navbar-brand" href="index.html">
                <img src="logo.jpg" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                Homehub
            </a>

            <!-- Menu button (F08): only shows on small screens like phones -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- The links: in a row on big screens, hidden in the menu button on phones -->
            <div class="collapse navbar-collapse" id="mainMenu">
                <div class="navbar-nav ms-auto gap-md-3">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                    <a class="nav-link" href="projects_page.html">Projects</a>
                    <!-- Community menu: a dropdown with the community pages -->
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Community</a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="submit_tip.html">Share a tip</a>
                            <a class="dropdown-item" href="gallery.html">Photo gallery</a>
                            <!-- end of community links -->
                        </div>
                    </div>
                    <a class="btn btn-success" href="login.html">Login</a>
                </div>
            </div>

        </div>
    </nav>

    <!-- USER PROFILE PAGE (F10) -->
    <!-- script.js fills in the details of the person who is logged in.  -->
    <!-- If nobody is logged in it shows the "please log in" box instead. -->

    <!-- Shows when nobody is logged in -->
    <div id="profileLoggedOut" class="container my-5 text-center d-none">
        <h2>You are not logged in</h2>
        <p class="text-muted">Log in or create an account to see your profile.</p>
        <a href="login.html" class="btn btn-success">Login</a>
        <a href="sign_up.html" class="btn btn-outline-success">Sign up</a>
    </div>

    <!-- The profile (hidden until script.js shows it) -->
    <div id="profilePage" class="container my-5 d-none">

        <div class="row g-4">

            <!-- Left: name, email and stats -->
            <div class="col-lg-4">
                <div class="card shadow-sm p-4 text-center">
                    <!-- A circle with the first letter of the person's name -->
                    <div id="profileInitial" class="profile-circle mx-auto mb-3">?</div>
                    <h3 id="profileName">Name</h3>
                    <p class="text-muted mb-1" id="profileEmail">email</p>
                    <p class="text-muted small">Member since <span id="profileSince"></span></p>

                    <div class="row text-center my-3">
                        <div class="col"><strong id="profileTipCount">0</strong><br><span class="small text-muted">Tips shared</span></div>
                    </div>

                    <button id="logoutButton" class="btn btn-outline-danger w-100">Log out</button>
                </div>
            </div>

            <!-- Right: about me and the tips this person shared -->
            <div class="col-lg-8">

                <div class="card shadow-sm p-4 mb-4">
                    <h4>About me</h4>
                    <form id="profileForm">
                        <label for="profileBio" class="form-label text-muted">Tell the community about yourself and the DIY you like doing.</label>
                        <textarea id="profileBio" class="form-control mb-3" rows="3" maxlength="300"></textarea>
                        <button type="submit" class="btn btn-success">Save</button>
                        <span id="profileSaved" class="text-success ms-2 d-none">Saved!</span>
                    </form>
                </div>

                <div class="card shadow-sm p-4 mb-4">
                    <h4>My tips</h4>
                    <div class="row g-3" id="myPosts"></div>
                </div>

            </div>

        </div>

    </div>

    <footer class="footer mt-5">
        <div class="text-center p-3" >
            &copy; 2026 Homehub. All rights reserved.
            <br><a href="privacy_policy.html" class="text-white">Privacy Policy</a>
        </div>
    </footer>
        


    <!-- Bootstrap's script: makes the phone menu button open and close (F08) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our own code (it goes after Bootstrap so it can use Bootstrap's pop-ups) -->
    <script src="script.js"></script>

</body>
