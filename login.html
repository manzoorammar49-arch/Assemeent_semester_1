
<head>
    <title>Login - HomeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

   <!-- Top Navbar (same as the other pages) -->
    <nav class="navbar bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand" href="#">
                <img src="logo.jpg" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                Homehub
            </a>
            <div class="d-flex gap-3">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="projects_page.html">Projects</a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container my-5">

        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow-sm p-4">

                    <h2 class="text-center mb-4">Welcome to HomeHub</h2>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" id="loginEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                    <p id="message" class="text-center mt-3"></p>

                    <p class="text-center">
                        Don't have an account?
                        <a href="sign_up.html">Sign up</a>
                    </p>

                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
