   <!-- Top Navbar -->

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- The links: in a row on big screens, hidden in the menu button on phones -->
            <div class="collapse navbar-collapse" id="mainMenu">
                <div class="navbar-nav ms-auto gap-md-3">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                    <a class="nav-link" href="projects_page.html">Projects</a>
                    <!-- Community menu: a dropdown with the community pages -->
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Community</a>

    <!-- SUBMIT A TIP, GUIDE OR RECOMMENDATION (F06) -->
    <!-- The form is saved by script.js into the browser (localStorage) -->
    <div class="container my-5">

        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card shadow-sm p-4">

                    <h2 class="text-center mb-2">Share a tip</h2>
                    <p class="text-center text-muted mb-4">Help the community with a quick tip, a how-to guide or something you recommend.</p>

                    <form id="tipForm">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="tipType" class="form-label">What are you sharing?</label>
                                <select id="tipType" class="form-select" required>
                                    <option value="tip">A quick tip</option>
                                    <option value="guide">A step-by-step guide</option>
                                    <option value="recommendation">A recommendation</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="tipCategory" class="form-label">Category</label>
                                <select id="tipCategory" class="form-select" required>
                                    <option value="general">General</option>
                                    <option value="garden">Garden</option>
                                    <option value="painting">Painting</option>
                                    <option value="renovation">Renovation</option>
                                    <option value="building">Building</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tipTitle" class="form-label">Title</label>
                            <input type="text" id="tipTitle" class="form-control" maxlength="80" placeholder="e.g. Use a damp cloth to clean paint brushes" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipText" class="form-label">Your tip, guide or recommendation</label>
                            <textarea id="tipText" class="form-control" rows="5" maxlength="1000" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="tipAuthor" class="form-label">Your name (leave empty to post as Anonymous)</label>
                            <input type="text" id="tipAuthor" class="form-control" maxlength="40">
                        </div>

                        <button type="submit" class="btn btn-success w-100">Share it</button>

                    </form>

                    <!-- Shows after the form is sent -->
                    <div id="tipMessage" class="alert alert-success mt-3 d-none">Thanks! Your post has been shared below.</div>

                </div>

            </div>
        </div>

    </div>


    <!-- Every tip people have shared (filled in by script.js) -->
    <div class="bg-light py-5">
        <div class="container">
            <h2 class="text-center mb-4">Community tips</h2>
            <div class="row g-4" id="allPosts"></div>
        </div>
    </div>
